<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>nora</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    line-height: 1.85;
    font-size: 16px;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 160px; }
  #doc h1 { font-size: 30px; line-height: 1.3; margin: 0 0 16px; }
  #doc h2 { font-size: 21px; margin: 48px 0 12px; padding-bottom: 6px; border-bottom: 1px solid; }
  #doc h3 { font-size: 17px; margin: 32px 0 8px; }
  #doc p { margin: 0 0 14px; }
  #doc blockquote { margin: 16px 0; padding: 4px 0 4px 16px; border-left: 2px solid; }
  #doc hr { border: 0; border-top: 1px dashed; margin: 40px 0; }
  #doc code { font-family: inherit; font-size: 13px; border: 1px solid; border-radius: 4px; padding: 0 6px; margin-right: 4px; }
  #doc ul, #doc ol { padding-left: 22px; margin: 0 0 14px; }
  #doc li { margin: 4px 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  #doc table { border-collapse: collapse; width: 100%; font-size: 15px; }
  #doc th, #doc td { border-bottom: 1px solid; padding: 8px 10px; text-align: left; vertical-align: top; }
  #doc td:first-child { white-space: nowrap; }


  /* 각주: translation-work의 각주 미리보기를 그대로 가져옴 */
  #doc sup { line-height: 0; }
  #doc sup[id^="fnref"] { font-size: 1em; }
  #doc sup[id^="fnref"] a.footnote { font-size: 0.85em; }
  #doc sup[id^="fnref"] a.footnote::before { content: "["; }
  #doc sup[id^="fnref"] a.footnote::after { content: "]"; }
  #doc .footnotes { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid; font-size: 15px; }
  #doc .footnotes ol { padding-left: 1.5rem; }
  #doc .footnotes p { margin-bottom: 0.5rem; }
  #doc .has-footnote-preview { position: relative; }
  #doc .footnote-preview {
    display: none;
    position: fixed;
    z-index: 10;
    width: max-content;
    max-width: min(520px, 80vw);
    padding: 0.65rem 0.8rem;
    border: 1px solid;
    border-radius: 6px;
    background: Canvas;
    color: CanvasText;
    box-shadow: 0 4px 14px rgb(0 0 0 / 12%);
    font-size: 14px;
    line-height: 1.6;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  #doc .footnote-preview.is-visible { display: block; }
  @media (hover: none) {
    #doc .footnote-preview {
      max-width: calc(100vw - 24px);
      padding: 0.8rem 1rem;
      font-size: 15px;
      box-shadow: 0 6px 24px rgb(0 0 0 / 20%);
    }
  }
  html { scroll-behavior: smooth; }

  #doc .w { display: inline-block; }
  #doc a .w { text-decoration: underline; text-decoration-thickness: inherit; text-underline-offset: inherit; }
  @media (prefers-reduced-motion: reduce) { #doc .w { transform: none !important; } }

  /* 스크롤 바: 기본 스크롤 바를 숨기고 점선 트랙과 눈금으로 대신한다 */
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  #sb-canvas { position: fixed; top: 0; right: 0; width: 96px; height: 100vh; pointer-events: none; z-index: 20; }
  #sb-hit { position: fixed; right: 0; width: 44px; z-index: 21; cursor: pointer; touch-action: none; }
  #sb-arrow {
    position: fixed; right: 18px; bottom: 18px; z-index: 21;
    background: none; border: 0; padding: 6px; color: inherit; cursor: pointer;
    opacity: .55; transition: opacity .25s, transform .25s;
  }
  #sb-arrow:hover { opacity: 1; }
  #sb-arrow.hidden { opacity: 0; transform: translateY(6px); pointer-events: none; }
</style>
</head>
<body>
<main><article id="doc"></article></main>
<canvas id="sb-canvas" aria-hidden="true"></canvas>
<div id="sb-hit" aria-hidden="true"></div>
<button id="sb-arrow" aria-label="아래로">
  <svg width="16" height="22" viewBox="0 0 16 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v17M2 13l6 6 6-6"/></svg>
</button>

<script>
  const docEl = document.getElementById('doc');

  async function load(name, push = true) {
    try {
      const res = await fetch(name);
      if (!res.ok) throw new Error(res.status);
      docEl.innerHTML = renderWithFootnotes(await res.text());
      docEl.querySelectorAll('table').forEach(t => {
        const w = document.createElement('div'); w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
      docEl.querySelectorAll('a[href$=".md"]').forEach(a => {
        const target = a.getAttribute('href').replace(/^\.\//, '');
        a.addEventListener('click', e => { e.preventDefault(); load(target); });
      });
    } catch (e) {
      docEl.innerHTML = '<p>문서를 불러오지 못했어요. 같은 폴더에 ' + name + ' 파일이 있는지 확인해 주세요.</p>';
    }
    if (push) history.pushState({ name }, '', '#' + name.replace(/\.md$/, ''));
    window.scrollTo(0, 0);
    wrapWords();
    buildFootnotePreviews();
    requestAnimationFrame(measure);
  }
  window.addEventListener('popstate', e => load((e.state && e.state.name) || 'main.md', false));


  // [^이름] 각주를 kramdown과 같은 모양(sup#fnref:이름 > a.footnote, div.footnotes > li#fn:이름)으로 만든다
  function renderWithFootnotes(md) {
    const defs = {};
    const lines = md.split('\n');
    const body = [];
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^\[\^([^\]]+)\]:\s?(.*)$/);
      if (!m) { body.push(lines[i]); continue; }
      let text = m[2];
      while (i + 1 < lines.length && /^(\s{2,}|\t)\S/.test(lines[i + 1])) text += '\n' + lines[++i].trim();
      defs[m[1]] = text;
    }
    const order = [];
    const esc = s => encodeURIComponent(s).replace(/%/g, '');
    let out = body.join('\n').replace(/\[\^([^\]]+)\](?!:)/g, (all, id) => {
      if (!(id in defs)) return all;
      if (!order.includes(id)) order.push(id);
      const n = order.indexOf(id) + 1, k = esc(id);
      return `<sup id="fnref:${k}"><a href="#fn:${k}" class="footnote">${n}</a></sup>`;
    });
    let html = marked.parse(out);
    if (order.length) {
      html += '<div class="footnotes"><ol>' + order.map(id => {
        const k = esc(id);
        const back = ` <a href="#fnref:${k}" class="reversefootnote">↩</a>`;
        let inner = marked.parse(defs[id]).trim();
        inner = /<\/p>$/.test(inner) ? inner.replace(/<\/p>$/, back + '</p>') : inner + back;
        return `<li id="fn:${k}">${inner}</li>`;
      }).join('') + '</ol></div>';
    }
    return html;
  }

  // translation-work/assets/js/footnotes.js 와 같은 동작
  const isTouch = window.matchMedia('(hover: none)').matches;
  function closeAllPreviews() {
    docEl.querySelectorAll('.footnote-preview.is-visible').forEach(p => p.classList.remove('is-visible'));
  }
  if (isTouch) {
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.footnote-preview, a.footnote')) closeAllPreviews();
    });
  }

  function buildFootnotePreviews() {
    docEl.querySelectorAll("sup[id^='fnref'] a.footnote").forEach((link) => {
      const targetId = decodeURIComponent(link.getAttribute("href").slice(1));
      const target = document.getElementById(targetId);
      if (!target) return;

      const note = target.cloneNode(true);
      note.querySelectorAll("a[href^='#fnref']").forEach((backlink) => backlink.remove());

      const preview = document.createElement("span");
      preview.className = "footnote-preview";

      const numberLink = document.createElement("a");
      numberLink.href = link.getAttribute("href");
      numberLink.textContent = `[${link.textContent.trim()}]`;
      preview.append(numberLink, " ");

      Array.from(note.childNodes).forEach((node) => {
        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "P") {
          while (node.firstChild) preview.appendChild(node.firstChild);
          preview.append(" ");
        } else {
          preview.appendChild(node);
        }
      });

      link.parentElement.appendChild(preview);
      link.parentElement.classList.add("has-footnote-preview");

      // 표 안처럼 잘리는 상자 안에서도 보이도록 화면 기준으로 띄운다
      const place = () => {
        const r = link.getBoundingClientRect();
        const pw = preview.offsetWidth, ph = preview.offsetHeight;
        const vw = document.documentElement.clientWidth, vh = window.innerHeight;
        let left = Math.min(r.left, vw - pw - 12);
        let top = r.bottom + 4;
        if (top + ph > vh - 8 && r.top - ph - 4 > 8) top = r.top - ph - 4;
        preview.style.left = Math.max(12, left) + 'px';
        preview.style.top = top + 'px';
      };
      const show = () => { preview.classList.add("is-visible"); place(); };
      const hide = () => preview.classList.remove("is-visible");
      window.addEventListener('scroll', () => { if (preview.classList.contains('is-visible')) place(); }, { passive: true });
      if (isTouch) {
        // 모바일: 나무위키처럼 각주를 누르면 팝업으로 띄우고, 바깥을 누르면 닫는다
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const open = preview.classList.contains("is-visible");
          closeAllPreviews();
          if (!open) show();
        });
      } else {
        link.parentElement.addEventListener("mouseenter", show);
        link.parentElement.addEventListener("mouseleave", hide);
        link.addEventListener("focus", show);
        link.addEventListener("blur", hide);
      }
    });
  }

  let words = [];
  let active = new Set();

  function wrapWords() {
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.trim()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const frag = document.createDocumentFragment();
      n.nodeValue.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = part;
        frag.appendChild(sp);
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function resetAll() {
    active.forEach(el => { el.style.transform = ''; el.style.transformOrigin = ''; });
    active.clear();
  }

  function measure() {
    resetAll();
    const y = window.scrollY;
    words = [...docEl.querySelectorAll('.w')].filter(el => !el.closest('.footnote-preview')).map(el => {
      const r = el.getBoundingClientRect();
      return { el, top: r.top + y, h: r.height };
    }).sort((a, b) => a.top - b.top);
    bend();
  }

  function firstAt(from) {
    let lo = 0, hi = words.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (words[m].top < from) lo = m + 1; else hi = m; }
    return lo;
  }

  function squash(w, edge, zone, side, next) {
    const y = w.top - window.scrollY + w.h / 2;
    let t = side === 'top' ? (y - edge) / zone : (edge - y) / zone;
    t = Math.max(0, Math.min(1, t));
    if (t >= 1) return;
    const s = 0.08 + 0.92 * (1 - (1 - t) * (1 - t));
    w.el.style.transformOrigin = side === 'top' ? '50% 0%' : '50% 100%';
    w.el.style.transform = `scaleY(${s.toFixed(3)})`;
    next.add(w.el);
  }

  let ticking = false;
  function bend() {
    ticking = false;
    if (!words.length) return;
    const y = window.scrollY, vh = window.innerHeight;
    const zone = Math.max(36, Math.min(72, vh * 0.08));
    const next = new Set();
    for (let i = firstAt(y - 40); i < words.length && words[i].top < y + zone; i++)
      squash(words[i], 0, zone, 'top', next);
    for (let i = firstAt(y + vh - zone - 40); i < words.length && words[i].top < y + vh; i++)
      squash(words[i], vh, zone, 'bottom', next);
    active.forEach(el => { if (!next.has(el)) { el.style.transform = ''; el.style.transformOrigin = ''; } });
    active = next;
  }

  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(bend); } }, { passive: true });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  const start = (location.hash.slice(1) || 'main') + '.md';
  load(start, false);

  // ── 스크롤 바 ─────────────────────────────────────────────
  // 쉴 때는 아래 화살표만, 움직이면 점선 트랙과 현재 위치를 중심으로 퍼지는 눈금이 나타난다.
  (() => {
    const cv = document.getElementById('sb-canvas');
    const hit = document.getElementById('sb-hit');
    const arrow = document.getElementById('sb-arrow');
    const ctx = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const GAP = 7;          // 점 간격
    const DOT = 2;          // 점 길이
    const RIGHT = 22;       // 오른쪽 여백
    let W = 0, H = 0, dpr = 1, trackTop = 0, trackH = 0, maxExt = 46, spread = 30;

    let pos = 0;            // 화면에 그려지는 위치 (0~1)
    let target = 0;         // 목표 위치
    let hoverY = null;      // 마우스가 트랙 위에 있을 때 y
    let reveal = 0;         // 0 화살표 상태, 1 트랙 상태
    let wantOpen = false, idleTimer = 0, dragging = false, last = 0;

    function size() {
      dpr = window.devicePixelRatio || 1;
      W = 96; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.height = H + 'px';
      trackH = Math.round(Math.min(360, H * 0.46));
      trackTop = Math.round((H - trackH) / 2);
      maxExt = innerWidth < 820 ? 26 : 46;
      spread = Math.max(18, trackH * 0.09);
      hit.style.top = trackTop - 10 + 'px';
      hit.style.height = trackH + 20 + 'px';
    }

    function scrollMax() { return Math.max(1, document.documentElement.scrollHeight - innerHeight); }
    function progress() { return Math.min(1, Math.max(0, scrollY / scrollMax())); }

    function open() {
      wantOpen = true;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { if (hoverY === null && !dragging) wantOpen = false; }, 1200);
      kick();
    }

    let running = false;
    function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      target = progress();
      const k = reduce ? 1 : 1 - Math.exp(-dt / 0.06);
      pos += (target - pos) * k;
      const r = reduce ? 1 : 1 - Math.exp(-dt / 0.09);
      reveal += ((wantOpen ? 1 : 0) - reveal) * r;
      if (Math.abs(reveal - (wantOpen ? 1 : 0)) < 0.002) reveal = wantOpen ? 1 : 0;

      draw();
      const scrollable = document.documentElement.scrollHeight > innerHeight + 4;
      const atBottom = !scrollable || scrollY >= scrollMax() - 2;
      arrow.classList.toggle('hidden', reveal > 0.05 || atBottom);

      const settled = Math.abs(target - pos) < 0.0005 && (reveal === 0 || reveal === 1);
      if (settled && !wantOpen && reveal === 0) { running = false; return; }
      if (settled && hoverY === null && !dragging && reveal === 1 && !wantOpen) { running = false; return; }
      requestAnimationFrame(frame);
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      if (reveal <= 0) return;
      const color = getComputedStyle(document.body).color;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineWidth = 1.6;
      const x = W - RIGHT;

      // 처음 열릴 때: 아래에서 위로 실선이 자라고, 이어서 점선으로 풀린다
      const grow = Math.min(1, reveal / 0.45);
      const dots = Math.max(0, (reveal - 0.35) / 0.65);
      if (dots < 1) {
        ctx.globalAlpha = 0.5 * (1 - dots);
        ctx.beginPath();
        ctx.moveTo(x, trackTop + trackH);
        ctx.lineTo(x, trackTop + trackH - trackH * grow);
        ctx.stroke();
      }
      if (dots <= 0) { ctx.globalAlpha = 1; return; }

      const center = hoverY !== null && !dragging
        ? Math.min(trackTop + trackH, Math.max(trackTop, hoverY))
        : trackTop + pos * trackH;
      const n = Math.floor(trackH / GAP);
      for (let i = 0; i <= n; i++) {
        const y = trackTop + i * GAP;
        const d = (y - center) / spread;
        const f = Math.exp(-d * d);                 // 가운데에서 가장 길다
        const len = DOT + (maxExt - DOT) * f * dots;
        ctx.globalAlpha = (0.35 + 0.55 * f) * dots;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - len, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function yToScroll(y) {
      const t = Math.min(1, Math.max(0, (y - trackTop) / trackH));
      return t * scrollMax();
    }

    hit.addEventListener('pointerenter', e => { hoverY = e.clientY; open(); });
    hit.addEventListener('pointermove', e => {
      hoverY = e.clientY;
      if (dragging) window.scrollTo({ top: yToScroll(e.clientY), behavior: 'instant' });
      open();
    });
    hit.addEventListener('pointerleave', () => { if (!dragging) { hoverY = null; open(); } });
    hit.addEventListener('pointerdown', e => {
      dragging = true; hit.setPointerCapture(e.pointerId);
      window.scrollTo({ top: yToScroll(e.clientY), behavior: 'instant' });
      open();
    });
    hit.addEventListener('pointerup', e => {
      dragging = false; hit.releasePointerCapture(e.pointerId);
      if (!hit.matches(':hover')) hoverY = null;
      open();
    });

    arrow.addEventListener('click', () => window.scrollBy({ top: innerHeight * 0.8, behavior: 'smooth' }));
    window.addEventListener('scroll', open, { passive: true });
    window.addEventListener('resize', () => { size(); kick(); });

    size();
    pos = target = progress();
    kick();
    // 문서가 바뀌어 길이가 달라지면 화살표 상태를 다시 계산
    new ResizeObserver(() => kick()).observe(document.body);
  })();
</script>
</body>
</html>
