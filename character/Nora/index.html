<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>nora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Serif KR", serif;
    line-height: 1.85;
    font-size: 16px;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 160px; }
  #doc h1 { font-size: 30px; line-height: 1.3; margin: 0 0 16px; }
  #doc h2 { font-size: 21px; margin: 48px 0 12px; padding-bottom: 6px; border-bottom: 1px solid; }
  #doc h3 { font-size: 17px; margin: 32px 0 8px; }
  #doc p { margin: 0 0 14px; }
  #doc blockquote { margin: 16px 0; padding: 4px 0 4px 16px; border-left: 2px solid; }
  #doc hr { border: 0; border-top: 1px dashed; margin: 40px 0; }
  #doc code { font-family: inherit; font-size: 13px; border: 1px solid; border-radius: 4px; padding: 0 6px; margin-right: 4px; }
  #doc ul, #doc ol { padding-left: 22px; margin: 0 0 14px; }
  #doc li { margin: 4px 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  #doc table { border-collapse: collapse; width: 100%; font-size: 15px; }
  #doc th, #doc td { border-bottom: 1px solid; padding: 8px 10px; text-align: left; vertical-align: top; }
  #doc td:first-child { white-space: nowrap; }

  #doc .w { display: inline-block; }
  @media (prefers-reduced-motion: reduce) { #doc .w { transform: none !important; } }
</style>
</head>
<body>
<main><article id="doc"></article></main>

<script>
  const docEl = document.getElementById('doc');

  async function load(name, push = true) {
    try {
      const res = await fetch(name);
      if (!res.ok) throw new Error(res.status);
      docEl.innerHTML = marked.parse(await res.text());
      docEl.querySelectorAll('table').forEach(t => {
        const w = document.createElement('div'); w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
      docEl.querySelectorAll('a[href$=".md"]').forEach(a => {
        const target = a.getAttribute('href').replace(/^\.\//, '');
        a.addEventListener('click', e => { e.preventDefault(); load(target); });
      });
    } catch (e) {
      docEl.innerHTML = '<p>문서를 불러오지 못했어요. 같은 폴더에 ' + name + ' 파일이 있는지 확인해 주세요.</p>';
    }
    if (push) history.pushState({ name }, '', '#' + name.replace(/\.md$/, ''));
    window.scrollTo(0, 0);
    wrapWords();
    requestAnimationFrame(measure);
  }
  window.addEventListener('popstate', e => load((e.state && e.state.name) || 'main.md', false));

  let words = [];
  let active = new Set();

  function wrapWords() {
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.trim()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const frag = document.createDocumentFragment();
      n.nodeValue.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = part;
        frag.appendChild(sp);
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function resetAll() {
    active.forEach(el => { el.style.transform = ''; el.style.transformOrigin = ''; });
    active.clear();
  }

  function measure() {
    resetAll();
    const y = window.scrollY;
    words = [...docEl.querySelectorAll('.w')].map(el => {
      const r = el.getBoundingClientRect();
      return { el, top: r.top + y, h: r.height };
    }).sort((a, b) => a.top - b.top);
    bend();
  }

  function firstAt(from) {
    let lo = 0, hi = words.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (words[m].top < from) lo = m + 1; else hi = m; }
    return lo;
  }

  function squash(w, edge, zone, side, next) {
    const y = w.top - window.scrollY + w.h / 2;
    let t = side === 'top' ? (y - edge) / zone : (edge - y) / zone;
    t = Math.max(0, Math.min(1, t));
    if (t >= 1) return;
    const s = 0.08 + 0.92 * (1 - (1 - t) * (1 - t));
    w.el.style.transformOrigin = side === 'top' ? '50% 0%' : '50% 100%';
    w.el.style.transform = `scaleY(${s.toFixed(3)})`;
    next.add(w.el);
  }

  let ticking = false;
  function bend() {
    ticking = false;
    if (!words.length) return;
    const y = window.scrollY, vh = window.innerHeight;
    const zone = Math.max(36, Math.min(72, vh * 0.08));
    const next = new Set();
    for (let i = firstAt(y - 40); i < words.length && words[i].top < y + zone; i++)
      squash(words[i], 0, zone, 'top', next);
    for (let i = firstAt(y + vh - zone - 40); i < words.length && words[i].top < y + vh; i++)
      squash(words[i], vh, zone, 'bottom', next);
    active.forEach(el => { if (!next.has(el)) { el.style.transform = ''; el.style.transformOrigin = ''; } });
    active = next;
  }

  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(bend); } }, { passive: true });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  const start = (location.hash.slice(1) || 'main') + '.md';
  load(start, false);
</script>
</body>
</html>
