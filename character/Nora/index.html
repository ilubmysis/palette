<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엘레오노라 E. 루벤슈타인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --paper: #f3eee4;
    --paper-2: #e9e2d4;
    --ink: #2a2622;
    --ink-soft: #6b6359;
    --red: #a3271f;
    --line: #d6ccba;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1a17;
      --paper-2: #26231f;
      --ink: #e7e0d3;
      --ink-soft: #a29a8c;
      --red: #d9574c;
      --line: #3a352e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Noto Serif KR", serif;
    line-height: 1.85;
    font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 760px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .bar .name { font-weight: 700; margin-right: auto; letter-spacing: .02em; }
  .bar .name small { color: var(--red); font-weight: 400; margin-left: 6px; }
  nav button, .toggle {
    font: inherit; font-size: 14px; color: var(--ink-soft);
    background: none; border: 0; padding: 4px 8px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--red); }
  .toggle { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
  .toggle[aria-pressed="true"] { color: var(--red); border-color: var(--red); }

  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 160px; }
  #doc h1 { font-size: 30px; line-height: 1.3; margin: 0 0 16px; }
  #doc h2 {
    font-size: 21px; margin: 48px 0 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  #doc h3 { font-size: 17px; margin: 32px 0 8px; }
  #doc p { margin: 0 0 14px; }
  #doc a { color: var(--red); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  #doc blockquote {
    margin: 16px 0; padding: 4px 0 4px 16px;
    border-left: 2px solid var(--red); color: var(--ink-soft);
  }
  #doc hr { border: 0; border-top: 1px dashed var(--line); margin: 40px 0; }
  #doc code {
    font-family: inherit; font-size: 13px; color: var(--red);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 4px;
  }
  #doc ul, #doc ol { padding-left: 22px; margin: 0 0 14px; }
  #doc li { margin: 4px 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  #doc table { border-collapse: collapse; width: 100%; font-size: 15px; }
  #doc th, #doc td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  #doc th { background: var(--paper-2); font-weight: 600; }
  #doc td:first-child { white-space: nowrap; }

  /* 유리병 효과: 화면 위아래 가장자리에 닿은 글자만 그쪽으로 납작하게 눌린다 */
  #doc .w { display: inline-block; }
  @media (prefers-reduced-motion: reduce) {
    #doc .w { transform: none !important; }
  }
  .loading { color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="name">노라 E. 루벤슈타인<small>에라타</small></div>
    <nav>
      <button data-doc="main.md">개요</button>
      <button data-doc="life.md">생애</button>
      <button data-doc="works.md">저작</button>
    </nav>
    <button class="toggle" id="bottle" aria-pressed="false">유리병</button>
  </div>
</header>
<main><article id="doc"><p class="loading">문서를 펼치는 중…</p></article></main>

<script>
  const docEl = document.getElementById('doc');
  const navBtns = [...document.querySelectorAll('nav button')];
  const docs = navBtns.map(b => b.dataset.doc);

  async function load(name, push = true) {
    if (!docs.includes(name)) name = 'main.md';
    docEl.innerHTML = '<p class="loading">문서를 펼치는 중…</p>';
    try {
      const res = await fetch(name);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      docEl.innerHTML = marked.parse(md);
      docEl.querySelectorAll('table').forEach(t => {
        const w = document.createElement('div'); w.className = 'table-wrap';
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      });
      // 문서 안의 ./life.md 같은 링크는 이 페이지 안에서 열기
      docEl.querySelectorAll('a[href$=".md"]').forEach(a => {
        const target = a.getAttribute('href').replace('./', '');
        a.addEventListener('click', e => { e.preventDefault(); load(target); });
      });
    } catch (e) {
      docEl.innerHTML = '<p>문서를 불러오지 못했어요. 같은 폴더에 ' + name + ' 파일이 있는지 확인해 주세요.</p>';
    }
    navBtns.forEach(b => b.setAttribute('aria-current', b.dataset.doc === name ? 'page' : 'false'));
    if (push) history.pushState({ name }, '', '#' + name.replace('.md', ''));
    window.scrollTo(0, 0);
    wrapWords();
    requestAnimationFrame(measure);
  }

  navBtns.forEach(b => b.addEventListener('click', () => load(b.dataset.doc)));
  window.addEventListener('popstate', e => load((e.state && e.state.name) || 'main.md', false));

  // 유리병: 화면 위아래 가장자리에 닿은 낱말만, 그 가장자리 쪽으로 납작하게 눌린다
  const toggle = document.getElementById('bottle');
  const header = document.querySelector('header');
  let bottleOn = true;
  try { const v = localStorage.getItem('nora-bottle'); if (v !== null) bottleOn = v === '1'; } catch (e) {}

  let words = [];      // { el, top, h } 문서 기준 위치, top 오름차순
  let active = new Set();

  function wrapWords() {
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.trim()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const frag = document.createDocumentFragment();
      n.nodeValue.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = part;
        frag.appendChild(sp);
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function measure() {
    resetAll();
    const y = window.scrollY;
    words = [...docEl.querySelectorAll('.w')].map(el => {
      const r = el.getBoundingClientRect();
      return { el, top: r.top + y, h: r.height };
    }).sort((a, b) => a.top - b.top);
    bend();
  }

  function resetAll() {
    active.forEach(el => { el.style.transform = ''; el.style.transformOrigin = ''; });
    active.clear();
  }

  // top 기준으로 from 이상인 첫 낱말 위치
  function firstAt(from) {
    let lo = 0, hi = words.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (words[m].top < from) lo = m + 1; else hi = m; }
    return lo;
  }

  function squash(w, edge, zone, side, next) {
    const y = w.top - window.scrollY + w.h / 2;
    let t = side === 'top' ? (y - edge) / zone : (edge - y) / zone;
    t = Math.max(0, Math.min(1, t));
    if (t >= 1) return;
    const s = 0.08 + 0.92 * (1 - (1 - t) * (1 - t)); // 가장자리에 가까울수록 급하게 납작해진다
    w.el.style.transformOrigin = side === 'top' ? '50% 0%' : '50% 100%';
    w.el.style.transform = `scaleY(${s.toFixed(3)})`;
    next.add(w.el);
  }

  let ticking = false;
  function bend() {
    ticking = false;
    if (!bottleOn || !words.length) return;
    const y = window.scrollY, vh = window.innerHeight;
    const topEdge = header.offsetHeight, zone = Math.max(36, Math.min(72, vh * 0.08));
    const next = new Set();
    for (let i = firstAt(y + topEdge - 40); i < words.length && words[i].top < y + topEdge + zone; i++)
      squash(words[i], topEdge, zone, 'top', next);
    for (let i = firstAt(y + vh - zone - 40); i < words.length && words[i].top < y + vh; i++)
      squash(words[i], vh, zone, 'bottom', next);
    active.forEach(el => { if (!next.has(el)) { el.style.transform = ''; el.style.transformOrigin = ''; } });
    active = next;
  }

  function setBottle(on) {
    bottleOn = on;
    toggle.setAttribute('aria-pressed', on);
    try { localStorage.setItem('nora-bottle', on ? '1' : '0'); } catch (e) {}
    if (on) bend(); else resetAll();
  }
  toggle.addEventListener('click', () => setBottle(!bottleOn));
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(bend); } }, { passive: true });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  setBottle(bottleOn);
  const start = (location.hash.slice(1) || 'main') + '.md';
  load(start, false);
</script>
</body>
</html>
